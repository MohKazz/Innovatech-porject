name: Terraform Apply
on:
  workflow_dispatch: {} # Manual trigger to initiate deployment
  
concurrency: # Ensures only one apply job runs at a time for this branch
  group: terraform-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1
      AWS_PAGER: ""
      TF_VAR_soc_email: ${{ secrets.SOC_EMAIL }} 
    steps:
      - uses: actions/checkout@v4 # Gets your infrastructure code

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.5.0 }

      - name: Configure AWS credentials (temp tokens)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Terraform init (S3 backend)
        run: terraform init -input=false # Prepares environment and links to remote state

      - name: Terraform apply (auto-approve)
        run: terraform apply -input=false -auto-approve -lock-timeout=5m 
        # -auto-approve: Skips the manual "yes" confirmation
        # -lock-timeout=5m: Waits 5 minutes for the state lock if another process is using it
