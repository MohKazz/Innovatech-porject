#first part is to define the api version and, kind of k8s we are creating and the metadata(name, namespace, labels)
apiVersion: apps/v1
kind: Deployment #define what kind of k8s object we are creating
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak 

#second part is for the specification of the deployment  
spec:
  replicas: 1
  selector: # link the newly created pods to the keycloak deployment we specified above in metadata label.  
    matchLabels:
      app: keycloak
  template:
    metadata: # deployment for pods
      labels:
        app: keycloak
    spec:
       containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:23.0.7
          args: ["start-dev"]

          env:
              - name: KC_DB
                value: postgres
              - name: KC_DB_URL_HOST
                value: "postgres-keycloak"
              - name: KC_DB_URL_PORT
                value: "5432"
              - name: KC_DB_URL_DATABASE
                value: "keycloak"
              - name: KC_DB_USERNAME
                value: "keycloak"
              - name: KC_DB_PASSWORD
                value: "password"
              - name: KC_PROXY
                value: "edge" 
        
              - name: KC_HOSTNAME
              # update this with the load balancer domain created for keycloak service when returning to aws
                value: "localhost"
              - name: KC_HOSTNAME_PORT #delete this when returning to aws
                value: "8081" ##delete this when returning to aws
              
              - name: KC_HOSTNAME_STRICT_HTTPS
                value: "false"
              - name: KC_HOSTNAME_STRICT
                value: "false"

               # admin user setup
              - name: KEYCLOAK_ADMIN
                value: "admin"
              - name: KEYCLOAK_ADMIN_PASSWORD
                value: "admin"

          ports:
            - name: http
              containerPort: 8080
         # reserve this amount of cpu and memory for the keycloak container
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
         # check if the keycloak server is up and running
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 100
            periodSeconds: 10
